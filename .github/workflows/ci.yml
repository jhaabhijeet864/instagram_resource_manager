name: CI Test Suite

on:
  push:
    branches: [ instagram, main ]
  pull_request:
    branches: [ instagram, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npm run typecheck

    - name: Backend test suite (Vitest)
      run: npm test

    - name: Plugin static checks
      run: node scripts/plugins-runner.mjs test
